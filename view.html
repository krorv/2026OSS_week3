<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>친구 상세보기</title>
  <!-- Bootstrap 5 CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="my.css">
</head>
<body>

<!-- Navigation Bar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="index.html">👥 친구관리</a>
    <button class="navbar-toggler" type="button"
            data-bs-toggle="collapse" data-bs-target="#navbarMenu"
            aria-controls="navbarMenu" aria-expanded="false" aria-label="메뉴 열기">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarMenu">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item">
          <a class="nav-link" href="index.html">목록</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="add.html">친구 추가</a>
        </li>
      </ul>
    </div>
  </div>
</nav>

<!-- 메인 콘텐츠 -->
<div class="container my-4">

  <div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-6">

      <!-- 페이지 제목 -->
      <h1 class="h3 fw-bold mb-4">🔍 친구 상세보기</h1>

      <!-- 알림 메시지 영역 -->
      <div id="alert-area"></div>

      <!-- 상세 정보 카드 -->
      <div class="card shadow-sm">
        <div class="card-body">

          <!-- 상세 정보 테이블 -->
          <table class="table table-bordered mb-0">
            <tbody>
              <tr>
                <th class="table-light" style="width:35%">이름</th>
                <td id="detail-name"></td>
              </tr>
              <tr>
                <th class="table-light">관계</th>
                <td id="detail-relation"></td>
              </tr>
              <tr>
                <th class="table-light">전화번호</th>
                <td id="detail-phone"></td>
              </tr>
              <tr>
                <th class="table-light">이메일</th>
                <td id="detail-email"></td>
              </tr>
              <tr>
                <th class="table-light">주소</th>
                <td id="detail-address"></td>
              </tr>
              <tr>
                <th class="table-light">생일</th>
                <td id="detail-birthday"></td>
              </tr>
            </tbody>
          </table>

          <!-- 버튼 영역 -->
          <div class="d-flex gap-2 mt-4 pt-3 border-top">
            <a id="edit-btn" href="#" class="btn btn-success">Edit</a>
            <button class="btn btn-danger" onclick="handleDelete()">Delete</button>
            <a href="index.html" class="btn btn-secondary">Back</a>
          </div>

        </div>
      </div>

    </div>
  </div>
</div>

<!-- Footer -->
<footer class="footer bg-dark text-secondary text-center py-3">
  <small>친구관리 프로그램 &copy; 2026</small>
</footer>

<!-- Bootstrap 5 JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="script.js"></script>
<script>
  // URL에서 id를 읽는다. view.html?id=3 → friendId = 3
  var friendId = Number(getParam("id"));

  // -------------------------------------------------------
  // [CRUD 중 Read 담당] 친구 상세 정보를 화면에 표시
  // -------------------------------------------------------
  function loadFriendDetail() {
    var friend = getFriendById(friendId);

    if (!friend) {
      document.getElementById("alert-area").innerHTML =
        '<div class="alert alert-danger" role="alert">친구 정보를 찾을 수 없습니다.</div>';
      return;
    }

    document.getElementById("detail-name").textContent     = friend.name     || "-";
    document.getElementById("detail-relation").textContent = friend.relation || "-";
    document.getElementById("detail-phone").textContent    = friend.phone    || "-";
    document.getElementById("detail-email").textContent    = friend.email    || "-";
    document.getElementById("detail-address").textContent  = friend.address  || "-";
    document.getElementById("detail-birthday").textContent = friend.birthday || "-";

    // [Edit] 버튼 링크에 id 포함
    document.getElementById("edit-btn").href = "edit.html?id=" + friendId;
  }

  // -------------------------------------------------------
  // [CRUD 중 Delete 담당] 삭제 버튼 클릭 시 실행
  // -------------------------------------------------------
  function handleDelete() {
    var friend = getFriendById(friendId);
    var friendName = friend ? friend.name : "이 친구";

    var confirmed = confirm(
      "[삭제 확인]\n\n" +
      "'" + friendName + "' 님을 정말로 삭제하시겠습니까?\n\n" +
      "삭제된 데이터는 복구할 수 없습니다."
    );

    if (!confirmed) return;

    deleteFriend(friendId);
    alert("'" + friendName + "' 님이 삭제되었습니다.");
    location.href = "index.html";
  }

  loadFriendDetail();
</script>

</body>
</html>
