<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>친구 목록</title>
  <!-- 공통 CSS 파일 연결 -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

  <!-- 페이지 제목 영역 -->
  <div class="page-header">
    <h1>👥 친구 목록</h1>
    <!-- [Add] 버튼: 클릭하면 add.html로 이동 -->
    <a href="add.html" class="btn btn-primary">+ Add</a>
  </div>

  <!-- 친구 목록 테이블을 감싸는 카드 -->
  <div class="card">
    <table class="friend-table">
      <thead>
        <tr>
          <th>이름</th>
          <th>관계</th>
          <th>전화번호</th>
          <th>이메일</th>
          <th>생일</th>
          <th>상세보기</th>
        </tr>
      </thead>
      <!-- tbody 안의 내용은 JavaScript로 동적으로 채운다 -->
      <tbody id="friend-list">
      </tbody>
    </table>
  </div>

</div>

<!-- 공통 스크립트 파일 연결 (친구 데이터 함수들이 들어있음) -->
<script src="script.js"></script>

<script>
  // -------------------------------------------------------
  // [CRUD 중 Read 담당] 친구 목록을 화면에 표시하는 함수
  // -------------------------------------------------------
  function renderFriendList() {
    // script.js의 getFriends() 함수로 localStorage에서 친구 목록을 가져온다.
    var friends = getFriends();

    // tbody 요소를 가져온다. 여기에 친구 행(tr)들을 추가할 것이다.
    var tbody = document.getElementById("friend-list");

    // tbody를 비운다. (새로고침 시 중복 방지)
    tbody.innerHTML = "";

    // 친구가 한 명도 없을 때 안내 메시지 표시
    if (friends.length === 0) {
      tbody.innerHTML = '<tr class="empty-row"><td colspan="6">등록된 친구가 없습니다.</td></tr>';
      return;
    }

    // 친구 목록을 반복하며 각각 한 줄(tr)씩 만든다.
    for (var i = 0; i < friends.length; i++) {
      var friend = friends[i];

      // 테이블 행(tr) 요소를 만든다.
      var tr = document.createElement("tr");

      // tr 안에 들어갈 HTML을 문자열로 작성한다.
      // view.html?id=숫자 → 해당 친구의 id를 URL에 담아서 이동하는 방식
      tr.innerHTML =
        "<td>" + friend.name + "</td>" +
        "<td>" + friend.relation + "</td>" +
        "<td>" + friend.phone + "</td>" +
        "<td>" + friend.email + "</td>" +
        "<td>" + friend.birthday + "</td>" +
        "<td>" +
          '<a href="view.html?id=' + friend.id + '" class="btn btn-primary" style="font-size:12px; padding:5px 12px;">보기</a>' +
        "</td>";

      // 완성된 tr을 tbody에 추가한다.
      tbody.appendChild(tr);
    }
  }

  // 페이지가 로드되면 즉시 친구 목록을 그린다.
  renderFriendList();
</script>

</body>
</html>
