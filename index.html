<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>친구 목록</title>
  <!-- Bootstrap 5 CSS CDN -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <!-- 커스텀 스타일 (Bootstrap 이후에 로드해야 덮어쓰기 가능) -->
  <link rel="stylesheet" href="my.css">
</head>
<body>

<!-- -------------------------------------------------------
     Navigation Bar
     Bootstrap navbar + navbar-expand-lg: 데스크톱은 가로, 모바일은 햄버거
     ------------------------------------------------------- -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="index.html">👥 친구관리</a>

    <!-- 모바일 햄버거 버튼 (Bootstrap data-bs-toggle으로 동작) -->
    <button class="navbar-toggler" type="button"
            data-bs-toggle="collapse" data-bs-target="#navbarMenu"
            aria-controls="navbarMenu" aria-expanded="false" aria-label="메뉴 열기">
      <span class="navbar-toggler-icon"></span>
    </button>

    <!-- 메뉴 목록 (모바일에서 collapse/expand) -->
    <div class="collapse navbar-collapse" id="navbarMenu">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item">
          <a class="nav-link active" href="index.html">목록</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="add.html">친구 추가</a>
        </li>
      </ul>
    </div>
  </div>
</nav>

<!-- 메인 콘텐츠 -->
<div class="container my-4">

  <!-- 페이지 제목 + Add 버튼 -->
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="h3 mb-0 fw-bold">친구 목록</h1>
    <a href="add.html" class="btn btn-primary">
      <i>+</i> Add
    </a>
  </div>

  <!-- 친구 목록 카드 -->
  <div class="card shadow-sm">
    <div class="card-body p-0">
      <!-- table-responsive: 모바일에서 테이블 가로 스크롤 -->
      <div class="table-responsive">
        <table class="table table-hover table-striped mb-0">
          <thead class="table-dark">
            <tr>
              <th>이름</th>
              <th>관계</th>
              <th>전화번호</th>
              <th>이메일</th>
              <th>생일</th>
              <th>상세보기</th>
            </tr>
          </thead>
          <!-- tbody 내용은 JavaScript로 동적으로 채운다 -->
          <tbody id="friend-list">
          </tbody>
        </table>
      </div>
    </div>
  </div>

</div>

<!-- Footer -->
<footer class="footer bg-dark text-secondary text-center py-3 mt-5">
  <small>친구관리 프로그램 &copy; 2026</small>
</footer>

<!-- Bootstrap 5 JS (navbar collapse 동작에 필요) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="script.js"></script>
<script>
  // -------------------------------------------------------
  // [CRUD 중 Read 담당] 친구 목록을 화면에 표시하는 함수
  // -------------------------------------------------------
  function renderFriendList() {
    var friends = getFriends();
    var tbody = document.getElementById("friend-list");
    tbody.innerHTML = "";

    if (friends.length === 0) {
      tbody.innerHTML =
        '<tr><td colspan="6" class="text-center text-muted py-4">등록된 친구가 없습니다.</td></tr>';
      return;
    }

    for (var i = 0; i < friends.length; i++) {
      var friend = friends[i];
      var tr = document.createElement("tr");
      tr.innerHTML =
        "<td>" + friend.name + "</td>" +
        "<td>" + friend.relation + "</td>" +
        "<td>" + (friend.phone || "-") + "</td>" +
        "<td>" + (friend.email || "-") + "</td>" +
        "<td>" + (friend.birthday || "-") + "</td>" +
        "<td>" +
          '<a href="view.html?id=' + friend.id + '" class="btn btn-primary btn-sm">보기</a>' +
        "</td>";
      tbody.appendChild(tr);
    }
  }

  renderFriendList();
</script>

</body>
</html>
