<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>친구 추가</title>
  <!-- Bootstrap 5 CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="my.css">
</head>
<body>

<!-- Navigation Bar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="index.html">👥 친구관리</a>
    <button class="navbar-toggler" type="button"
            data-bs-toggle="collapse" data-bs-target="#navbarMenu"
            aria-controls="navbarMenu" aria-expanded="false" aria-label="메뉴 열기">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarMenu">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item">
          <a class="nav-link" href="index.html">목록</a>
        </li>
        <li class="nav-item">
          <a class="nav-link active" href="add.html">친구 추가</a>
        </li>
      </ul>
    </div>
  </div>
</nav>

<!-- 메인 콘텐츠 -->
<div class="container my-4">

  <!-- row/col로 폼 너비 제한 (데스크톱에서 중앙 정렬) -->
  <div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-6">

      <!-- 페이지 제목 -->
      <h1 class="h3 fw-bold mb-4">➕ 친구 추가</h1>

      <!-- 알림 메시지 영역 -->
      <div id="alert-area"></div>

      <!-- 친구 정보 입력 폼 카드 -->
      <div class="card shadow-sm">
        <div class="card-body">
          <form id="add-form" onsubmit="return handleSubmit()">

            <!-- 이름 -->
            <div class="mb-3">
              <label for="name" class="form-label fw-semibold">
                이름 <span class="text-danger">*</span>
              </label>
              <input type="text" class="form-control" id="name" placeholder="이름을 입력하세요">
            </div>

            <!-- 관계 -->
            <div class="mb-3">
              <label for="relation" class="form-label fw-semibold">
                관계 <span class="text-danger">*</span>
              </label>
              <select class="form-select" id="relation">
                <option value="">-- 선택하세요 --</option>
                <option value="친구">친구</option>
                <option value="직장동료">직장동료</option>
                <option value="선배">선배</option>
                <option value="후배">후배</option>
                <option value="가족">가족</option>
                <option value="지인">지인</option>
                <option value="기타">기타</option>
              </select>
            </div>

            <!-- 전화번호 -->
            <div class="mb-3">
              <label for="phone" class="form-label fw-semibold">전화번호</label>
              <input type="text" class="form-control" id="phone" placeholder="010-0000-0000">
            </div>

            <!-- 이메일 -->
            <div class="mb-3">
              <label for="email" class="form-label fw-semibold">이메일</label>
              <input type="text" class="form-control" id="email" placeholder="example@email.com">
            </div>

            <!-- 주소 -->
            <div class="mb-3">
              <label for="address" class="form-label fw-semibold">주소</label>
              <input type="text" class="form-control" id="address" placeholder="주소를 입력하세요">
            </div>

            <!-- 생일 -->
            <div class="mb-3">
              <label for="birthday" class="form-label fw-semibold">
                생일 <span class="text-danger">*</span>
              </label>
              <input type="date" class="form-control" id="birthday">
            </div>

            <!-- 버튼 영역 -->
            <div class="d-flex gap-2 mt-4 pt-3 border-top">
              <button type="submit" class="btn btn-primary">등록</button>
              <button type="button" class="btn btn-secondary"
                      onclick="location.href='index.html'">Cancel</button>
            </div>

          </form>
        </div>
      </div>

    </div>
  </div>
</div>

<!-- Footer -->
<footer class="footer bg-dark text-secondary text-center py-3 mt-5">
  <small>친구관리 프로그램 &copy; 2026</small>
</footer>

<!-- Bootstrap 5 JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="script.js"></script>
<script>
  // -------------------------------------------------------
  // [CRUD 중 Create 담당] 폼 제출 처리 함수
  // -------------------------------------------------------
  function handleSubmit() {
    var name     = document.getElementById("name").value.trim();
    var relation = document.getElementById("relation").value;
    var phone    = document.getElementById("phone").value.trim();
    var email    = document.getElementById("email").value.trim();
    var address  = document.getElementById("address").value.trim();
    var birthday = document.getElementById("birthday").value;

    // [Validation 1] 이름 필수값 확인
    if (name === "") {
      showAlert("이름은 필수 입력 항목입니다.", "danger");
      return false;
    }

    // [Validation 2] 이름 2글자 이상
    if (name.length < 2) {
      showAlert("이름은 2글자 이상 입력해주세요.", "danger");
      return false;
    }

    // [Validation 3] 관계 선택 여부
    if (relation === "") {
      showAlert("관계를 선택해주세요.", "danger");
      return false;
    }

    // [Validation 4] 이메일 형식
    if (email !== "") {
      var emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!emailRegex.test(email)) {
        showAlert("이메일 형식이 올바르지 않습니다. (예: example@email.com)", "danger");
        return false;
      }
    }

    // [Validation 5] 전화번호 형식
    if (phone !== "") {
      var phoneRegex = /^\d{2,3}-\d{3,4}-\d{4}$/;
      if (!phoneRegex.test(phone)) {
        showAlert("전화번호 형식이 올바르지 않습니다. (예: 010-1234-5678)", "danger");
        return false;
      }
    }

    // [Validation 6] 생일 필수값
    if (birthday === "") {
      showAlert("생일을 입력해주세요.", "danger");
      return false;
    }

    // confirm 확인
    var confirmed = confirm(
      "친구가 추가됩니다.\n\n" +
      "이름: " + name + "\n" +
      "관계: " + relation + "\n\n" +
      "추가하시겠습니까?"
    );
    if (!confirmed) return false;

    addFriend({ name, relation, phone, email, address, birthday });

    showAlert("친구가 등록되었습니다! 목록으로 이동합니다...", "success");
    setTimeout(function() { location.href = "index.html"; }, 1200);

    return false;
  }

  // Bootstrap alert 컴포넌트 사용
  function showAlert(message, type) {
    document.getElementById("alert-area").innerHTML =
      '<div class="alert alert-' + type + ' alert-dismissible fade show" role="alert">' +
        message +
        '<button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="닫기"></button>' +
      '</div>';
  }
</script>

</body>
</html>
